topic: test the fixture mechanism
tests:
  - name: full strength units
    map: |2
         0000      0100      0200      0300
      |inf     ||arm     ||art     ||        |
              0001      0101      0201
           |INF     ||ARM     ||        |
         -102      0002      0202      0302
      |        ||ART     ||        ||        |
    assert_units:
      - Axis Infantry Str 4 @ 0000
      - Axis Armor Str 3 @ 0100
      - Axis Artillery Str 2 @ 0200
      - Allies Infantry Str 4 @ 0001
      - Allies Armor Str 3 @ 0101
      - Allies Artillery Str 2 @ 0002

  - name: available moves in battle phase
    turn: Allies
    phase: Battle
    map: |2
         0000      0100      0200      0300
      |inf     ||        ||        ||        |
              0001      0101      0201
           |INF     ||INF     ||        |
         -102      0002      0202      0302
      |        ||        ||        ||        |
    assert_available_moves:
      - Battle 0001->0000 3 dice
      - Battle 0101->0000 2 dice
